<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Aluno | AVA-EDUCA+</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="./cadastro-aluno.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-brand">
            <img src="../assets/imagens/logo-ava-educa.png" alt="Logo AVA-EDUCA+" class="topbar-logo">
        </div>

        <div class="topbar-user">
            <div class="user-avatar" id="user-avatar">
                AC
            </div>

            <div class="user-info">
                <strong id="user-name">
                    Usuário
                </strong>

                <span>
                    Professor(a)
                </span>
            </div>
        </div>
    </header>


    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-menu">

                <a href="../dashboard/dashboard.html" class="menu-item" >
                     <img src="../assets/icons/dashboard.svg"  alt="" >

                    <span>Dashboard</span>
                </a>


                <button type="button" class="menu-item disabled" disabled>
                     <img src="../assets/icons/book.svg" alt="" >

                    <span>Cursos</span>
                 </button>


                <a href="./cadastro-aluno.html" class="menu-item active" >
                    <img src="../assets/icons/students.svg" alt="" >

                    <span>Cadastro de Alunos</span>
                </a>


                <button type="button" id="logout-button" class="menu-item logout-button" >
                    <img src="../assets/icons/logout.svg" alt="" >

                    <span>Sair</span>

                </button>

            </nav>
        </aside>
        
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Cadastro de Aluno</h1>
                    <p>
                        Preencha os dados abaixo para cadastrar um novo aluno.
                    </p>
                </div>
            </div>


            <form id="student-form" class="student-form">

                <section class="form-section">

                    <h2>Dados pessoais</h2>

                    <div class="form-grid">

                        <div class="form-group full">
                            <label for="nome">
                                Nome completo
                            </label>

                            <input type="text" id="nome" name="nome" minlength="4" maxlength="80" required >
                        </div>


                        <div class="form-group">
                            <label for="genero">
                                Gênero
                            </label>

                            <select id="genero" name="genero" required >
                                <option value="">
                                    Selecione
                                </option>

                                <option value="Masculino">
                                    Masculino
                                </option>

                                <option value="Feminino">
                                    Feminino
                                </option>

                                <option value="Outro">
                                    Outro
                                </option>
                            </select>
                        </div>


                        <div class="form-group">
                            <label for="dataNascimento">
                                Data de nascimento
                            </label>

                            <input type="date" id="dataNascimento" name="dataNascimento" required >
                        </div>


                        <div class="form-group">
                            <label for="cpf">
                                CPF
                            </label>

                            <input type="text" id="cpf" name="cpf" required >
                        </div>


                        <div class="form-group">
                            <label for="telefone">
                                Telefone
                            </label>

                            <input type="text" id="telefone" name="telefone" required >
                        </div>


                        <div class="form-group full">
                            <label for="email">
                                E-mail
                            </label>

                            <input type="email" id="email" name="email" required >
                        </div>
                    </div>
                </section>


                <section class="form-section">

                    <h2>Endereço</h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="cep">
                                CEP
                            </label>

                            <input type="text" id="cep" name="cep" required >
                        </div>


                        <div class="form-group">
                            <label for="cidade">
                                Cidade
                            </label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="estado">
                                Estado
                            </label>

                            <input type="text" id="estado" name="estado" required >
                        </div>


                        <div class="form-group full">
                            <label for="logradouro">
                                Logradouro
                            </label>

                            <input type="text" id="logradouro" name="logradouro" required >
                        </div>


                        <div class="form-group">
                            <label for="numero">
                                Número
                            </label>

                            <input type="number" id="numero" name="numero" required >
                        </div>


                        <div class="form-group">
                            <label for="complemento">
                                Complemento
                            </label>

                            <input type="text" id="complemento" name="complemento" >
                        </div>


                        <div class="form-group full">
                            <label for="bairro">
                                Bairro
                            </label>

                            <input type="text" id="bairro" name="bairro" required >
                        </div>
                    </div>
                </section>


                <div id="student-feedback" class="student-feedback" >
                </div>


                <div class="form-actions">
                    <button type="submit" class="save-button" >
                        Salvar aluno
                    </button>
                </div>
            </form>

        <section class="students-list-section">

                <div class="students-list-header">
                    <div>
                        <h2>Alunos cadastrados</h2>
                            <p>
                                Lista de alunos cadastrados no AVA-EDUCA+.
                            </p>
                    </div>

                            <span id="students-count">
                                0 alunos cadastrados
                            </span>
                </div>


                <div class="table-wrapper">

                     <table class="students-table">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Gênero</th>
                                <th>CPF</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                            </tr>
                        </thead>

                        <tbody id="students-table-body">
                             <!-- preenchido pelo JavaScript -->
                        </tbody>
                     </table>
                </div>
        </section>



        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script type="module" src="./cadastro-aluno.js"></script>
    <script
        type="module"
        src="./cadastro-aluno.js"
    ></script>

    
</body>
</html>
